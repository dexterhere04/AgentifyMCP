name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build (ESM + types)
        run: pnpm build
      - name: Pack smoke test
        run: node -e "const{execSync}=require('child_process');execSync('pnpm --filter @agentify/canonical-commerce pack --pack-destination /tmp',{stdio:'inherit'})"
